/* =========================================================
   APPROXIMATE SUN/MOON CALCULATION
========================================================= */

function degToRad(x){
    return x*Math.PI/180;
}

function radToDeg(x){
    return x*180/Math.PI;
}

function normalize360(x){
    x %= 360;
    if(x<0) x += 360;
    return x;
}

/*
  Approximate solar longitude.
*/

function sunLongitude(date){

    const jd =
        date.getTime()/86400000 + 2440587.5;

    const n = jd - 2451545.0;

    const L = normalize360(
        280.460 + 0.9856474*n
    );

    const g = normalize360(
        357.528 + 0.9856003*n
    );

    return normalize360(
        L +
        1.915*Math.sin(degToRad(g)) +
        0.020*Math.sin(degToRad(2*g))
    );
}

/*
  Approximate lunar longitude.
*/

function moonLongitude(date){

    const jd =
        date.getTime()/86400000 + 2440587.5;

    const d = jd - 2451543.5;

    const N = normalize360(125.1228 - 0.0529538083*d);
    const i = 5.1454;

    const w = normalize360(318.0634 + 0.1643573223*d);
    const a = 60.2666;
    const e = 0.054900;

    const M = normalize360(
        115.3654 + 13.0649929509*d
    );

    const E =
        M +
        radToDeg(
            e *
            Math.sin(degToRad(M)) *
            (1 + e*Math.cos(degToRad(M)))
        );

    const xv =
        a *
        (Math.cos(degToRad(E))-e);

    const yv =
        a *
        Math.sqrt(1-e*e) *
        Math.sin(degToRad(E));

    const v = radToDeg(
        Math.atan2(yv,xv)
    );

    const r = Math.sqrt(xv*xv+yv*yv);

    const xh =
        r *
        (
            Math.cos(degToRad(N))*Math.cos(degToRad(v+w))
            -
            Math.sin(degToRad(N))*
            Math.sin(degToRad(v+w))*
            Math.cos(degToRad(i))
        );

    const yh =
        r *
        (
            Math.sin(degToRad(N))*Math.cos(degToRad(v+w))
            +
            Math.cos(degToRad(N))*
            Math.sin(degToRad(v+w))*
            Math.cos(degToRad(i))
        );

    let lon = radToDeg(
        Math.atan2(yh,xh)
    );

    lon = normalize360(lon);

    /*
      Add main lunar perturbation terms.
    */

    const Lm = normalize360(218.316 + 13.176396*d);
    const Ms = normalize360(357.529 + 0.98560028*d);
    const Mm = normalize360(134.963 + 13.064993*d);

    lon +=
        6.289*Math.sin(degToRad(Mm)) -
        1.274*Math.sin(degToRad(2*(Lm-sunLongitude(date))+Mm)) +
        0.658*Math.sin(degToRad(2*(Lm-sunLongitude(date)))) -
        0.214*Math.sin(degToRad(2*Mm)) -
        0.186*Math.sin(degToRad(Ms));

    return normalize360(lon);
}

/* =========================================================
   TITHI
========================================================= */

function calculateTithi(date){

    const sun = sunLongitude(date);
    const moon = moonLongitude(date);

    const elongation =
        normalize360(moon-sun);

    const tithiFloat =
        elongation/12;

    const index =
        Math.floor(tithiFloat);

    const fraction =
        tithiFloat-index;

    /*
      Approximate remaining time.
    */

    const nextDate =
        new Date(date.getTime()+3600000);

    const sun2 =
        sunLongitude(nextDate);

    const moon2 =
        moonLongitude(nextDate);

    const e2 =
        normalize360(moon2-sun2);

    let speed =
        normalize360(e2-elongation);

    if(speed>180) speed-=360;

    if(Math.abs(speed)<0.01)
        speed=0.5;

    const hours =
        (1-fraction)*12/Math.abs(speed);

    let endTime =
        new Date(date.getTime()+hours*3600000);

    /*
      Tithi index.
    */

    let tithiIndex=index;

    if(tithiIndex>29)
        tithiIndex=29;

    return {
        index:tithiIndex,
        name:TITHIS[tithiIndex],
        end:endTime
    };
}

/* =========================================================
   NAKSHATRA
========================================================= */

function calculateNakshatra(date){

    const moon =
        moonLongitude(date);

    const span =
        360/27;

    const index =
        Math.floor(moon/span);

    const fraction =
        (moon%span)/span;

    const nextDate =
        new Date(date.getTime()+3600000);

    const moon2 =
        moonLongitude(nextDate);

    let speed =
        normalize360(moon2-moon);

    if(speed>180)
        speed-=360;

    if(Math.abs(speed)<0.01)
        speed=13;

    const hours =
        (1-fraction)*span/Math.abs(speed);

    return {
        index:index,
        name:NAKSHATRAS[index],
        end:new Date(date.getTime()+hours*3600000)
    };
}

    let h=date.getHours();
    let m=date.getMinutes();

    const ap=h>=12 ? "PM" : "AM";

    h=h%12;

    if(h===0)
        h=12;

    return pad2(h)+":"+pad2(m)+" "+ap;
}

/* =========================================================
   SPECIAL TITHI
========================================================= */

function specialTithi(tithi){

    if(tithi==="পূর্ণিমা"){
        return {
            icon:"🌕",
            className:"purnima"
        };
    }

    if(tithi==="অমাবস্যা"){
        return {
            icon:"🌑",
            className:"amavasya"
        };
    }

    if(tithi==="একাদশী"){
        return {
            icon:"🪔",
            className:"ekadashi"
        };
    }

    return null;
}

/* =========================================================
   SUNRISE / SUNSET APPROXIMATION
========================================================= */

function approximateSunTimes(date){

    /*
      Kolkata seasonal approximation.
      Used only for UI Muhurta presentation.
    */

    const dayOfYear =
        Math.floor(
            (date-new Date(date.getFullYear(),0,0))/86400000
        );

    const decl =
        -23.44 *
        Math.cos(
            degToRad(
                360*(dayOfYear+10)/365
            )
        );

    const latRad=degToRad(LAT);

    const decRad=degToRad(decl);

    const hourAngle =
        radToDeg(
            Math.acos(
                -Math.tan(latRad)*Math.tan(decRad)
            )
        );

    const daylight =
        2*hourAngle/15;

    const sunriseHour =
        12-daylight/2;

    const sunsetHour =
        12+daylight/2;

    const sunrise =
        new Date(date);

    sunrise.setHours(
        Math.floor(sunriseHour),
        Math.round(
            (sunriseHour%1)*60
        ),
        0,0
    );

    const sunset =
        new Date(date);

    sunset.setHours(
        Math.floor(sunsetHour),
        Math.round(
            (sunsetHour%1)*60
        ),
        0,0
    );

    return {
        sunrise,
        sunset
    };
}

/* =========================================================
   SHUBH MUHURTA
========================================================= */

function getShubhMuhurtas(date){

    const times =
        approximateSunTimes(date);

    const sunrise =
        times.sunrise;

    const sunset =
        times.sunset;

    /*
      A simple daytime auspicious window.
      Detailed event-specific Muhurta remains on
      the advanced Panchanga page.
    */

    const duration =
        (sunset-sunrise)/4;

    const m1 =
        new Date(
            sunrise.getTime()+duration*0.15
        );

    const m2 =
        new Date(
            sunrise.getTime()+duration*0.85
        );

    const m3 =
        new Date(
            sunrise.getTime()+duration*2.15
        );

    const m4 =
        new Date(
            sunrise.getTime()+duration*2.85
        );

    return [
        {
            name:"শুভ মুহূর্ত",
            start:m1,
            end:m2
        },
        {
            name:"শুভ মুহূর্ত",
            start:m3,
            end:m4
        }
    ];
}

/* =========================================================
   MONTH SHUBHKARMA
========================================================= */

function getShubhEventsForMonth(monthIndex){

    const events=[];

    Object.keys(SHUBHKARMA).forEach(eventName=>{

        const days =
            SHUBHKARMA[eventName][monthIndex] || [];

        days.forEach(day=>{
            events.push({
                event:eventName,
                day:day
            });
        });

    });

    return events;
}

/* =========================================================
   SHUBHKARMA HTML
========================================================= */

function renderShubhkarma(monthIndex){

    const eventNames = Object.keys(SHUBHKARMA);

    let html=`
        <div class="shubh-section">
            <div class="shubh-title">
                🌸 শুভকর্ম
            </div>
    `;

    eventNames.forEach(eventName=>{

        const days =
            SHUBHKARMA[eventName][monthIndex] || [];

        html+=`
            <div class="shubh-row">
                <span class="shubh-label">
                    ${getEventIcon(eventName)}
                    ${eventName}:
                </span>
        `;

        if(days.length===0){

            html+=`<span>—</span>`;

        }else{

            days.forEach(day=>{

                html+=`
                    <span
                        class="shubh-date"
                        onclick="openShubhDate(${monthIndex},${day},'${eventName}')"
                    >
                        ${bnNumber(day)}
                    </span>
                `;

            });

        }

        html+=`</div>`;
    });

    html+=`</div>`;

    return html;
}

function getEventIcon(event){

    const icons={
        "বিবাহ":"💍",
        "গাত্রহরিদ্রা":"🟡",
        "অন্নপ্রাশন":"🍚",
        "গৃহপ্রবেশ":"🏠",
        "উপনয়ন":"🕉️",
        "বিদ্যারম্ভ":"✏️",
        "নামকরণ":"👶",
        "সাধভক্ষণ":"🌿"
    };

    return icons[event] || "🌸";
}

/* =========================================================
   MONTH CALENDAR
========================================================= */

function renderMonth(month,monthIndex){

    const startDate =
        parseDateLocal(month.start);

    const firstDay =
        startDate.getDay();

    let html=`

        <div class="month-card">

            <div class="month-header">
                ${month.name} ${month.year}
            </div>

            ${renderShubhkarma(monthIndex)}

            <div class="weekdays">
                <div>রবি</div>
                <div>সোম</div>
                <div>মঙ্গল</div>
                <div>বুধ</div>
                <div>বৃহস্পতি</div>
                <div>শুক্র</div>
                <div>শনি</div>
            </div>

            <div class="calendar">
    `;

    for(let i=0;i<firstDay;i++){

        html+=`<div class="empty"></div>`;

    }

    for(let day=1;day<=month.days;day++){

        const date =
            new Date(
                startDate.getFullYear(),
                startDate.getMonth(),
                startDate.getDate()+day-1
            );

        html+=renderDayBox(
            date,
            monthIndex,
            day
        );
    }

    html+=`
            </div>
        </div>
    `;

    return html;
}

/* =========================================================
   DAY BOX
========================================================= */

function renderDayBox(date,monthIndex,bengaliDay){

    const tithi =
        calculateTithi(date);

    const special =
        specialTithi(tithi.name);

    const isToday =
        dateISO(date)===dateISO(new Date());

    const shubh =
        getShubhEventsForMonth(monthIndex)
        .some(x=>x.day===bengaliDay);

    let tithiHTML;

    if(special){

        tithiHTML=`
            <div class="tithi-name special ${special.className}">
                ${special.icon} ${specialName(tithi.name)}
            </div>
        `;

    }else{

        tithiHTML=`
            <div class="tithi-name">
                ${tithi.name}
            </div>
        `;
    }

    return `
        <div
            class="day-box
                ${isToday ? "today":""}
                ${shubh ? "shubh":""}"
            onclick="openDateDetails('${dateISO(date)}',${monthIndex},${bengaliDay})"
        >

            <div class="bengali-date">
                ${bnNumber(bengaliDay)}
            </div>

            <div class="english-date">
                ${formatEnglishDate(date)}
            </div>

            ${tithiHTML}

            <div class="tithi-time">
                ${formatTime(tithi.end)}
            </div>

        </div>
    `;
}

function specialName(name){

    if(name==="পূর্ণিমা")
        return "পূর্ণিমা";

    if(name==="অমাবস্যা")
        return "অমাবস্যা";

    if(name==="একাদশী")
        return "একাদশী";

    return name;
}

/* =========================================================
   OPEN DATE DETAILS
========================================================= */

function openDateDetails(
    iso,
    monthIndex,
    bengaliDay
){

    const date =
        parseDateLocal(iso);

    const tithi =
        calculateTithi(date);

    const nak =
        calculateNakshatra(date);

    const muhurtas =
        getShubhMuhurtas(date);

    const month =
        bengaliMonths[monthIndex];

    let html=`

        <div class="detail-title">
            📅 ${month.name} ${bnNumber(bengaliDay)}
        </div>

        <div class="detail-date">
            ${date.toLocaleDateString(
                "en-IN",
                {
                    day:"numeric",
                    month:"long",
                    year:"numeric"
                }
            )}
            <br>
            ${tithi.name} — শেষ ${formatTime(tithi.end)}
        </div>

        <div class="detail-section muhurta-section">

            <div class="section-title">
                🌸 শুভ মুহূর্ত
            </div>
    `;

    muhurtas.forEach(m=>{

        html+=`
            <div class="time-line">
                <b>${m.name}</b><br>
                ${formatTime(m.start)}
                — 
                ${formatTime(m.end)}
            </div>
        `;

    });

    html+=`
        </div>

        <div class="detail-section nak-section">

            <div class="section-title">
                ⭐ নক্ষত্র
            </div>

            <div class="time-line">
                <b>${nak.name}</b><br>
                শেষ ${formatTime(nak.end)}
            </div>

        </div>
    `;

    document.getElementById(
        "detailContent"
    ).innerHTML=html;

    const panel =
        document.getElementById(
            "detailPanel"
        );

    panel.classList.add("show");

    panel.scrollIntoView({
        behavior:"smooth",
        block:"start"
    });
}

/* =========================================================
   SHUBHKARMA DATE
========================================================= */

function openShubhDate(
    monthIndex,
    bengaliDay,
    eventName
){

    event = eventName;

    const month =
        bengaliMonths[monthIndex];

    const startDate =
        parseDateLocal(month.start);

    const date =
        new Date(
            startDate.getFullYear(),
            startDate.getMonth(),
            startDate.getDate()+bengaliDay-1
        );

    openDateDetails(
        dateISO(date),
        monthIndex,
        bengaliDay
    );
}

/* =========================================================
   CLOSE
========================================================= */

function closeDetails(){

    document
        .getElementById("detailPanel")
        .classList.remove("show");
}

/* =========================================================
   RENDER YEAR
========================================================= */

function renderCalendar(){

    document.getElementById(
        "yearTitle"
    ).innerHTML=
        "🌺 বাংলা সন ১৪৩৩";

    let html="";

    bengaliMonths.forEach(
        (month,index)=>{
            html+=renderMonth(
                month,
                index
            );
        }
    );

    document.getElementById(
        "calendarContainer"
    ).innerHTML=html;
}

/* =========================================================
   NAVIGATION
========================================================= */

function showToday(){

    const today =
        new Date();

    const monthIndex =
        bengaliMonths.findIndex(
            m=>{
                const start =
                    parseDateLocal(m.start);

                const end =
                    new Date(
                        start.getTime()+
                        (m.days-1)*
                        86400000
                    );

                return today>=start &&
                       today<=end;
            }
        );

    if(monthIndex>=0){

        const month =
            bengaliMonths[monthIndex];

        const start =
            parseDateLocal(month.start);

        const bengaliDay =
            Math.floor(
                (today-start)/86400000
            )+1;

        setTimeout(()=>{

            openDateDetails(
                dateISO(today),
                monthIndex,
                bengaliDay
            );

        },300);
    }
}

    alert(

    );
}

    );
}

   START
