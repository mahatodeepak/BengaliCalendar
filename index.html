* {

    width: 100%;

h1 {

}

.subtitle {
    text-align: center;
    font-size: 14px;
    color: #666;
    margin-bottom: 12px;
}

/* MONTH CARD */

.month-card {
    width: 100%;
    background: white;
    margin: 0 0 18px;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(0,0,0,0.12);
}

/* MONTH HEADER */

.month-header {
    width: 100%;
    height: 55px;
    display: flex;
    align-items: center;
    background: #8b1e1e;
    color: white;
}

.month-nav {
    flex: 0 0 44px;
    width: 44px;
    height: 44px;
    margin: 0 5px;
    border: none;
    border-radius: 8px;
    background: rgba(255,255,255,0.15);
    color: white;
    font-size: 32px;
    line-height: 40px;
    cursor: pointer;
}

.month-nav:active {
    background: rgba(255,255,255,0.3);
}

.month-name {
    flex: 1;
    min-width: 0;
    text-align: center;
    font-size: 19px;
    font-weight: bold;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.month-name small {
    font-size: 13px;
    font-weight: normal;
    opacity: 0.95;
}

/* SHUBHKARMA */

.shubhkarma {
    padding: 10px 12px;
    background: #fff8e8;
    border-bottom: 1px solid #eee;
}

.shubh-title {
    font-size: 17px;
    font-weight: bold;
    color: #8b1e1e;

}

.shubh-row {
    font-size: 13px;
    line-height: 1.8;
}

.shubh-row strong {
    color: #333;
}

/* WEEKDAYS */

.weekdays {
    width: 100%;
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    background: #eee;
    border-bottom: 1px solid #ddd;
}

.weekday {
    min-width: 0;
    text-align: center;
    padding: 7px 2px;
    font-size: 12px;
    font-weight: bold;
    color: #555;
}

/* CALENDAR GRID */

.calendar {
    width: 100%;
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
}

/* EMPTY BOX */

.empty-cell {
    width: 100%;
    height: 105px;
    min-width: 0;
    background: #fafafa;
    border-right: 1px solid #eee;
    border-bottom: 1px solid #eee;
}

/* DATE BOX */

.day-box {
    width: 100%;
    height: 105px;
    min-width: 0;
    padding: 5px 3px;
    background: white;
    border-right: 1px solid #ddd;
    border-bottom: 1px solid #ddd;
    overflow: hidden;
    cursor: pointer;
    position: relative;
}

.day-box:hover {
    background: #fff8e8;
}

.day-box.selected {
    background: #fff1c7;
    box-shadow: inset 0 0 0 2px #d08b00;
}

/* DATE LINE */

.date-line {
    width: 100%;
    height: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    white-space: nowrap;

    font-size: 22px;
    font-weight: bold;
    color: #111;

.english-date {
    font-size: 11px;
    color: #777;

/* TITHI */

    font-size: 11px;
    font-weight: bold;
    color: #444;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.tithi-time {
    width: 100%;
    height: 22px;
    text-align: center;
    font-size: 10px;
    color: #777;
    white-space: nowrap;
    overflow: hidden;
}

/* SPECIAL SYMBOL */

    font-size: 13px;
    margin-left: 2px;

/* DETAILS */

    width: 100%;
    margin-top: 10px;
    padding: 13px;
    background: #fff;
    border-radius: 10px;
    border: 1px solid #ddd;
    display: none;

.details-title {

    color: #8b1e1e;
    margin-bottom: 8px;

.detail-section {

    line-height: 1.7;

.detail-label {

/* =========================================================

   ========================================================= */

function specialTithi(name) {

    if (name === "পূর্ণিমা") {
        return "🌕 পূর্ণিমা";
    }

    if (name === "অমাবস্যা") {
        return "🌑 অমাবস্যা";
    }

    if (name === "একাদশী") {
        return "🪔 একাদশী";
    }

    return name;
}


/* =========================================================
   FORMAT TIME
   ========================================================= */

function formatTime(minutes) {

    minutes = Math.round(minutes);

    minutes = ((minutes % 1440) + 1440) % 1440;

    let h = Math.floor(minutes / 60);
    let m = minutes % 60;

    const period = h >= 12 ? "PM" : "AM";

    let displayHour = h % 12;

    if (displayHour === 0) {
        displayHour = 12;
    }

    return String(displayHour).padStart(2, "0")
        + ":"
        + String(m).padStart(2, "0")
        + " "
        + period;
}


/* =========================================================
   APPROXIMATE TITHI CALCULATION
   ========================================================= */

function getTithi(date) {

    const dayNumber = Math.floor(
        (date.getTime() - new Date("2026-04-15").getTime())
        / 86400000
    );

    const index = Math.abs(dayNumber * 7) % 30;

    let name = tithis[index];

    /*
       Approximate end time.
       For production Panchika accuracy,
       this should later be replaced with
       an accurate ephemeris/data source.
    */

    let endMinutes = 18 * 60 + ((dayNumber * 17) % 300);

    return {
        name: name,
        end: endMinutes
    };
}


/* =========================================================
   APPROXIMATE NAKSHATRA
   ========================================================= */

function getNakshatra(date) {

    const dayNumber = Math.floor(
        (date.getTime() - new Date("2026-04-15").getTime())
        / 86400000
    );

    const index = Math.abs(dayNumber * 3) % nakshatras.length;

    let endMinutes = 8 * 60 + ((dayNumber * 29) % 900);

    return {
        name: nakshatras[index],
        end: endMinutes
    };
}

        const dateText = dates.length

        html += `

                ${icon} <strong>${name}:</strong> ${dateText}
            </div>
        `;
    });

    html += `</div>`;

    return html;

/* =========================================================
   CREATE MONTH
   ========================================================= */

function createMonth(month, index) {

    const card = document.createElement("div");

    card.className = "month-card";
    card.id = "month-" + index;

    /* MONTH HEADER */

    const header = document.createElement("div");

    header.className = "month-header";

    header.innerHTML = `
        <button
            class="month-nav"
            onclick="showPreviousMonth(${index})"
            aria-label="Previous month">
            ‹
        </button>

        <div class="month-name">
            ${month.name} ${bnNumber(month.year)}
            <small>• ${month.english} (${month.englishRange})</small>
        </div>

        <button
            class="month-nav"
            onclick="showNextMonth(${index})"
            aria-label="Next month">
            ›
        </button>
    `;

    card.appendChild(header);

    /* SHUBHKARMA */

    card.insertAdjacentHTML(
        "beforeend",
        createShubhkarma(index)
    );

    /* WEEKDAYS */

    const weekdayRow = document.createElement("div");

    weekdayRow.className = "weekdays";

    weekdays.forEach(day => {

        const cell = document.createElement("div");

        cell.className = "weekday";

        cell.textContent = day;

        weekdayRow.appendChild(cell);
    });

    card.appendChild(weekdayRow);

    /* CALENDAR */

    const calendar = document.createElement("div");

    calendar.className = "calendar";

    const startDate = new Date(month.start + "T00:00:00");

    const firstDay = startDate.getDay();

    /* EMPTY CELLS */

    for (let i = 0; i < firstDay; i++) {

        const emptyCell = document.createElement("div");

        emptyCell.className = "empty-cell";

        calendar.appendChild(emptyCell);
    }

    /* DATES */

    for (let day = 1; day <= month.days; day++) {

        const date = new Date(startDate);

        date.setDate(startDate.getDate() + day - 1);

        const tithi = getTithi(date);

        const dayBox = document.createElement("div");

        dayBox.className = "day-box";

        dayBox.dataset.date = date.toISOString();

        dayBox.innerHTML = `

            <div class="date-line">

                <span class="bengali-date">
                    ${bnNumber(day)}
                </span>

                <span class="english-date">
                    ${date.getDate()}
                </span>

            </div>

            <div class="tithi-name">
                ${specialTithi(tithi.name)}
            </div>

            <div class="tithi-time">
                শেষ ${formatTime(tithi.end)}
            </div>

        `;

        dayBox.onclick = function() {

            document
                .querySelectorAll(".day-box.selected")
                .forEach(box => {
                    box.classList.remove("selected");
                });

            dayBox.classList.add("selected");

            showDateDetails(
                date,
                month,
                day,
                tithi
            );
        };

        calendar.appendChild(dayBox);
    }

    card.appendChild(calendar);

    return card;
}

    ).innerHTML = `

        <b>
            ${month.name} ${bnNumber(bengaliDay)},
            ${bnNumber(month.year)}
        </b>
        <br>

        তিথি:
        ${specialTithi(tithi.name)}
        <br>

        তিথি শেষ:
        ${formatTime(tithi.end)}

    `;

    document.getElementById(
        "nakshatraName"
    ).innerHTML = `
        <b>${nak.name}</b>
    `;

    document.getElementById(
        "nakshatraEnd"
    ).innerHTML = `
        শেষ ${formatTime(nak.end)}
    `;

    setTimeout(() => {

        details.scrollIntoView({
            behavior: "smooth",
            block: "nearest"
        });

    }, 50);
}


/* =========================================================
   PREVIOUS MONTH
   ========================================================= */

function showPreviousMonth(index) {

    if (index <= 0) {

        document
            .getElementById("month-0")
            .scrollIntoView({
                behavior: "smooth",
                block: "start"
            });

        return;
    }

    document
        .getElementById("month-" + (index - 1))
        .scrollIntoView({
            behavior: "smooth",
            block: "start"
        });
}


/* =========================================================
   NEXT MONTH
   ========================================================= */

function showNextMonth(index) {

    if (index >= months.length - 1) {

        document
            .getElementById(
                "month-" + (months.length - 1)
            )
            .scrollIntoView({
                behavior: "smooth",
                block: "start"
            });

        return;
    }

    document
        .getElementById("month-" + (index + 1))
        .scrollIntoView({
            behavior: "smooth",
            block: "start"
        });
}


/* =========================================================
   BUILD COMPLETE CALENDAR
   ========================================================= */

function buildCalendar() {

    const container =
        document.getElementById(
            "calendarContainer"
        );

    container.innerHTML = "";

    months.forEach((month, index) => {

        const monthCard =
            createMonth(month, index);

        container.appendChild(monthCard);

    });
}


/* =========================================================
   START
   ========================================================= */

buildCalendar();

</script>
