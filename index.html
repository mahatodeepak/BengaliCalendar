/* =====================================================  
   TIME  
===================================================== */  
  
function formatTime(minutes){  
  
minutes=Math.round(minutes);  
  
minutes=((minutes%1440)+1440)%1440;  
  
let h=Math.floor(minutes/60);  
let m=minutes%60;  
  
let period=h>=12?"PM":"AM";  
  
let hour=h%12;  
  
if(hour===0)  
hour=12;  
  
return String(hour).padStart(2,"0")  
+":"+String(m).padStart(2,"0")  
+" "+period;  
  
}  
  
  
/* =====================================================  
   TITHI CALCULATION  
===================================================== */  
  
function getTithi(date){  
  
const base=  
new Date("2026-04-15T00:00:00");  
  
const dayNumber=  
Math.floor(  
(date-base)/86400000  
);  
  
const index=  
Math.abs(dayNumber*7)%30;  
  
const name=tithis[index];  
  
const endMinutes=  
18*60+  
((dayNumber*17)%300);  
  
return{  
name:name,  
end:endMinutes  
};  
  
}  
  
  
/* =====================================================  
   NAKSHATRA  
===================================================== */  
  
function getNakshatra(date){  
  
const base=  
new Date("2026-04-15T00:00:00");  
  
const dayNumber=  
Math.floor(  
(date-base)/86400000  
);  
  
const index=  
Math.abs(dayNumber*3)  
%nakshatras.length;  
  
const endMinutes=  
8*60+  
((dayNumber*29)%900);  
  
return{  
name:nakshatras[index],  
end:endMinutes  
};  
  
}

const startDate=  
new Date(  
month.start+"T00:00:00"  
);  
  
  
const firstDay=  
startDate.getDay();  
  
  
/* EMPTY CELLS */  
  
for(  
let i=0;  
i<firstDay;  
i++  
){  
  
const empty=  
document.createElement("div");  
  
empty.className="empty-cell";  
  
calendar.appendChild(empty);  
  
}  
  
  
/* DATES */  
  
for(  
let day=1;  
day<=month.days;  
day++  
){  
  
const date=  
new Date(startDate);  
  
date.setDate(  
startDate.getDate()+day-1  
);  
  
  
const tithi=  
getTithi(date);  
  
  
const box=  
document.createElement("div");  
  
box.className="day-box";  
  
  
box.innerHTML=`  
  
<div class="date-line">  
  
<span class="bengali-date">  
${bnNumber(day)}  
</span>  
  
<span class="english-date">  
${date.getDate()}  
</span>  
  
</div>  
  
<div class="tithi-name">  
${specialTithi(tithi.name)}  
</div>  
  
<div class="tithi-time">  
শেষ ${formatTime(tithi.end)}  
</div>  
  
`;  
  
  
box.onclick=function(){  
  
document  
.querySelectorAll(".day-box.selected")  
.forEach(b=>{  
b.classList.remove("selected");  
});  
  
box.classList.add("selected");  
  
showDateDetails(  
date,  
month,  
day,  
tithi  
);  
  
};  
  
  
calendar.appendChild(box);  
  
}  
  
  
card.appendChild(calendar);  
  
  
/* PUT COMPLETE CARD ON PAGE */  
  
container.appendChild(card);  
  
  
/* HIDE OLD DETAILS */  
  
document  
.getElementById("details")  
.classList.remove("show");  
  
}  
  
  
/* =====================================================  
   NEXT  
===================================================== */  
  
function nextMonth(){  
  
if(  
currentMonthIndex<  
months.length-1  
){  
  
currentMonthIndex++;  
  
renderMonth();  
  
window.scrollTo({  
top:0,  
behavior:"smooth"  
});  
  
}  
  
}  
  
  
/* =====================================================  
   PREVIOUS  
===================================================== */  
  
function previousMonth(){  
  
if(  
currentMonthIndex>0  
){  
  
currentMonthIndex--;  
  
renderMonth();  
  
window.scrollTo({  
top:0,  
behavior:"smooth"  
});  
  
}  
  
}  
  
  
/* =====================================================  
   DATE DETAILS  
===================================================== */  
  
function showDateDetails(  
date,  
month,  
day,  
tithi  
){  
  
const details=  
document.getElementById(  
"details"  
);  
  
const nak=  
getNakshatra(date);  
  
details.classList.add("show");  
  
  
document.getElementById(  
"muhurtaDetails"  
).innerHTML=`  
  
<b>  
${month.name}  
${bnNumber(day)}  
${bnNumber(month.year)}  
</b>  
  
<br>  
  
তিথি:  
${specialTithi(tithi.name)}  
  
<br>  
  
তিথি শেষ:  
${formatTime(tithi.end)}  
  
`;  
  
  
document.getElementById(  
"nakshatraName"  
).innerHTML=  
"<b>"+nak.name+"</b>";  
  
  
document.getElementById(  
"nakshatraEnd"  
).textContent=  
"শেষ "+formatTime(nak.end);  
  
  
details.scrollIntoView({  
behavior:"smooth",  
block:"nearest"  
});  
  
}  
  
  
/* =====================================================  
   START  
===================================================== */  
  
renderMonth();  
  
</script>  </body>  
</html>
