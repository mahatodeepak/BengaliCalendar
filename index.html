/* =====================================================
   AYANAMSHA
===================================================== */

/*
    Approximate Lahiri ayanamsha for this version.

    Later we can replace this with a full sidereal
    ephemeris implementation for closer Panjika matching.
*/

function lahiriAyanamsha(date){

    const year =
        date.getUTCFullYear() +
        date.getUTCMonth()/12;

    return 23.85 + (year - 2000) * 0.01396;

}


/* =====================================================
   NORMALIZE ANGLE
===================================================== */

function normalize360(angle){

    angle = angle % 360;

    if(angle < 0)
        angle += 360;

    return angle;

}


/* =====================================================
   SUN / MOON SIDEREAL LONGITUDE
===================================================== */

function sunLongitude(date){

    const tropical =
        Astronomy.HelioLongitude(date);

    return normalize360(
        tropical - lahiriAyanamsha(date)
    );

}


/*
   For Moon we use geocentric ecliptic longitude.
*/

function moonLongitude(date){

    const geo =
        Astronomy.GeoMoon(date);

    const ecl =
        Astronomy.EquatorToEcliptic(
            geo,
            date
        );

    return normalize360(
        ecl.elon - lahiriAyanamsha(date)
    );

}


/* =====================================================
   TITHI ANGLE
===================================================== */

function lunarAngle(date){

    const sun = sunLongitude(date);

    const moon = moonLongitude(date);

    return normalize360(moon - sun);

}


/* =====================================================
   TITHI
===================================================== */

function calculateTithi(date){

    const angle = lunarAngle(date);

    let index =
        Math.floor(angle / 12);

    if(index > 29)
        index = 29;

    const paksha =
        index < 15 ? "শুক্লপক্ষ" : "কৃষ্ণপক্ষ";

    const localIndex =
        index < 15 ? index : index - 15;

    let name;

    if(localIndex === 14){

        name =
            index < 15
            ? "পূর্ণিমা"
            : "অমাবস্যা";

    }else{

        name = tithiNames[localIndex];

    }

    return {
        index:index,
        localIndex:localIndex,
        paksha:paksha,
        name:name,
        angle:angle
    };

}


/* =====================================================
   NAKSHATRA
===================================================== */

function calculateNakshatra(date){

    const moon =
        moonLongitude(date);

    const span =
        360 / 27;

    let index =
        Math.floor(moon / span);

    if(index >= 27)
        index = 26;

    return {

        index:index,

        name:nakshatras[index],

        longitude:moon

    };

}


/* =====================================================
   FIND TRANSITION
===================================================== */

function findBoundary(
    date,
    type,
    forward=true
){

    const start =
        new Date(date.getTime());

    const startValue =
        type === "tithi"
        ? lunarAngle(start)
        : moonLongitude(start);

    let target;

    if(type === "tithi"){

        const current =
            Math.floor(startValue / 12);

        target =
            forward
            ? (current + 1) * 12
            : current * 12;

        if(target >= 360)
            target -= 360;

    }else{

        const span = 360 / 27;

        const current =
            Math.floor(startValue / span);

        target =
            forward
            ? (current + 1) * span
            : current * span;

        if(target >= 360)
            target -= 360;

    }


    /*
       Search in 5-minute increments first.
    */

    let previousDate =
        new Date(start.getTime());

    let previousValue =
        type === "tithi"
        ? lunarAngle(previousDate)
        : moonLongitude(previousDate);


    for(
        let minutes=5;
        minutes<=1440;
        minutes+=5
    ){

        const currentDate =
            new Date(
                start.getTime()
                +
                minutes*60000
            );

        const currentValue =
            type === "tithi"
            ? lunarAngle(currentDate)
            : moonLongitude(currentDate);


        let crossed=false;


        if(forward){

            if(
                currentValue < previousValue
            ){

                if(
                    target >= previousValue ||
                    target <= currentValue
                ){
                    crossed=true;
                }

            }else{

                if(
                    target >= previousValue &&
                    target <= currentValue
                ){
                    crossed=true;
                }

            }

        }


        if(crossed){

            let low =
                new Date(
                    previousDate.getTime()
                );

            let high =
                new Date(
                    currentDate.getTime()
                );


            /*
               Binary search to approximately
               one minute.
            */

            for(let i=0;i<8;i++){

                const middle =
                    new Date(
                        (low.getTime()+high.getTime())/2
                    );

                const middleValue =
                    type === "tithi"
                    ? lunarAngle(middle)
                    : moonLongitude(middle);


                let passed=false;


                if(
                    middleValue < previousValue
                ){

                    passed =
                        target >= previousValue ||
                        target <= middleValue;

                }else{

                    passed =
                        target >= previousValue &&
                        target <= middleValue;

                }


                if(passed){

                    high=middle;

                }else{

                    low=middle;

                    previousValue=middleValue;

                }

            }


            return high;

        }


        previousDate =
            currentDate;

        previousValue =
            currentValue;

    }


    return null;

}


/* =====================================================
   TIME FORMAT
===================================================== */

function formatTime(date){

    if(!date)
        return "—";

    return new Intl.DateTimeFormat(
        "bn-IN",
        {
            timeZone:TIME_ZONE,
            hour:"2-digit",
            minute:"2-digit",
            hour12:true
        }
    ).format(date);

}


/* =====================================================
   SPECIAL TITHI
===================================================== */

function specialTithi(tithi){

    if(tithi.name === "পূর্ণিমা")
        return "🌕";

    if(tithi.name === "অমাবস্যা")
        return "🌑";

    if(tithi.name === "একাদশী")
        return "🪔";

    return "";

}


/* =====================================================
   LOCAL DATE CREATION
===================================================== */

function makeLocalDate(year,month,day){

    return new Date(
        year,
        month-1,
        day,
        12,
        0,
        0
    );

}


/* =====================================================
   BENGALI DATE → GREGORIAN
===================================================== */

function getMonthStartDate(month){

    const parts =
        month.start.split("-");

    return makeLocalDate(
        Number(parts[0]),
        Number(parts[1]),
        Number(parts[2])
    );

}


/* =====================================================
   WEEKDAY
===================================================== */

const weekdayNames = [

    "রবি",
    "সোম",
    "মঙ্গল",
    "বুধ",
    "বৃহস্পতি",
    "শুক্র",
    "শনি"

];


/* =====================================================
   SELECTED DATE
===================================================== */

let selectedBox = null;


/* =====================================================
   SHOW DATE DETAILS
===================================================== */

function showDateDetails(
    date,
    month,
    day,
    tithi,
    nakshatra
){

    if(selectedBox){

        selectedBox.classList.remove(
            "selected"
        );

    }


    const box =
        document.querySelector(
            `[data-date="${date.getTime()}"]`
        );


    if(box){

        box.classList.add("selected");

        selectedBox=box;

    }


    const details =
        document.getElementById(
            "dateDetails"
        );


    /*
       Find next transition.
    */

    const tithiEnd =
        findBoundary(
            date,
            "tithi",
            true
        );


    const nakshatraEnd =
        findBoundary(
            date,
            "nakshatra",
            true
        );


    details.innerHTML = `

        <div class="details-title">
            🌸 শুভ মুহূর্ত
        </div>

        <div class="detail-row">
            <span class="detail-label">
                📅 বাংলা তারিখ:
            </span>
            <span class="detail-value">
                ${bnNumber(day)}
                ${month.name}
                ${bnNumber(month.year)}
            </span>
        </div>

        <div class="detail-row">
            <span class="detail-label">
                📆 ইংরেজি তারিখ:
            </span>
            <span class="detail-value">
                ${date.toLocaleDateString(
                    "en-IN",
                    {
                        day:"2-digit",
                        month:"long",
                        year:"numeric"
                    }
                )}
            </span>
        </div>

        <div class="detail-row">
            <span class="detail-label">
                🌙 পক্ষ:
            </span>
            <span class="detail-value">
                ${tithi.paksha}
            </span>
        </div>

        <div class="detail-row">
            <span class="detail-label">
                🔹 তিথি:
            </span>
            <span class="detail-value">
                ${specialTithi(tithi)}
                ${tithi.name}
            </span>
        </div>

        <div class="detail-row">
            <span class="detail-label">
                ⏰ তিথি শেষ:
            </span>
            <span class="detail-value">
                ${formatTime(tithiEnd)}
            </span>
        </div>

        <div class="detail-row">
            <span class="detail-label">
                ⭐ নক্ষত্র:
            </span>
            <span class="detail-value">
                ${nakshatra.name}
            </span>
        </div>

        <div class="detail-row">
            <span class="detail-label">
                ⏰ নক্ষত্র শেষ:
            </span>
            <span class="detail-value">
                ${formatTime(nakshatraEnd)}
            </span>
        </div>

    `;


    details.classList.add("show");

}


/* =====================================================
   RENDER ONE MONTH
===================================================== */

let currentMonthIndex=0;


function renderMonth(){

    const container =
        document.getElementById(
            "calendarContainer"
        );


    container.innerHTML="";

    selectedBox=null;


    const month =
        months[currentMonthIndex];


    /* =========================
       MONTH CARD
    ========================= */

    const card =
        document.createElement("div");

    card.className="month-card";


    /* =========================
       HEADER
    ========================= */

    const header =
        document.createElement("div");

    header.className="month-header";


    header.innerHTML = `

        <button
            class="month-nav"
            id="prevBtn"
            aria-label="Previous month">
            ‹
        </button>

        <div class="month-name">

            ${month.name}
            ${bnNumber(month.year)}

            <small>
                • ${month.english}
                (${month.englishRange})
            </small>

        </div>

        <button
            class="month-nav"
            id="nextBtn"
            aria-label="Next month">
            ›
        </button>

    `;


    card.appendChild(header);


    /* =========================
       IMPORTANT:
       Buttons are queried AFTER
       header is inserted.
    ========================= */

    const prevBtn =
        header.querySelector(
            "#prevBtn"
        );

    const nextBtn =
        header.querySelector(
            "#nextBtn"
        );


    prevBtn.onclick =
        function(){

            previousMonth();

        };


    nextBtn.onclick =
        function(){

            nextMonth();

        };


    prevBtn.disabled =
        currentMonthIndex===0;


    nextBtn.disabled =
        currentMonthIndex===
        months.length-1;


    /* =========================
       SHUBHKARMA
    ========================= */

    card.insertAdjacentHTML(
        "beforeend",
        createShubhkarma(
            currentMonthIndex
        )
    );


    /* =========================
       WEEKDAYS
    ========================= */

    const weekdays =
        document.createElement("div");

    weekdays.className="weekdays";


    weekdayNames.forEach(
        name => {

            const div =
                document.createElement("div");

            div.textContent=name;

            weekdays.appendChild(div);

        }
    );


    card.appendChild(weekdays);


    /* =========================
       CALENDAR GRID
    ========================= */

    const grid =
        document.createElement("div");

    grid.className="calendar-grid";


    const startDate =
        getMonthStartDate(month);


    const firstWeekday =
        startDate.getDay();


    /*
       Empty cells before first date.
    */

    for(
        let i=0;
        i<firstWeekday;
        i++
    ){

        const empty =
            document.createElement("div");

        empty.className =
            "day-box empty-day";

        grid.appendChild(empty);

    }


    /* =========================
       DAYS
    ========================= */

    for(
        let day=1;
        day<=month.days;
        day++
    ){

        const date =
            new Date(
                startDate.getTime()
                +
                (day-1)*86400000
            );


        const tithi =
            calculateTithi(date);


        const nakshatra =
            calculateNakshatra(date);


        const box =
            document.createElement("div");

        box.className="day-box";


        box.dataset.date =
            date.getTime();


        const symbol =
            specialTithi(tithi);


        box.innerHTML = `

            <div class="date-line">

                <span class="bengali-date">
                    ${bnNumber(day)}
                </span>

                <span class="english-date">
                    ${date.getDate()}
                </span>

            </div>

            <div class="tithi">

                ${symbol}
                ${tithi.name}

            </div>

            <div class="tithi-time">

                ${tithi.paksha}

            </div>

        `;


        box.onclick =
            function(){

                showDateDetails(
                    date,
                    month,
                    day,
                    tithi,
                    nakshatra
                );

            };


        grid.appendChild(box);

    }


    card.appendChild(grid);


    /* =========================
       DATE DETAILS
    ========================= */

    const details =
        document.createElement("div");

    details.id="dateDetails";

    details.className="date-details";


    card.appendChild(details);


    /* =========================
       ENGINE INFO
    ========================= */

    const info =
        document.createElement("div");

    info.className="engine-info";


    info.innerHTML = `
        📍 গণনার স্থান:
        কলকাতা, পশ্চিমবঙ্গ
        (${KOLKATA_LAT}°N,
        ${KOLKATA_LON}°E)
        <br>
        🌙 তিথি ও ⭐ নক্ষত্র
        জ্যোতির্বৈজ্ঞানিক Sun/Moon
        position থেকে গণনা করা হচ্ছে।
    `;


    card.appendChild(info);


    container.appendChild(card);

}


/* =====================================================
   NEXT MONTH
===================================================== */

function nextMonth(){

    if(
        currentMonthIndex <
        months.length-1
    ){

        currentMonthIndex++;

        renderMonth();

        window.scrollTo({
            top:0,
            behavior:"smooth"
        });

    }

}


/* =====================================================
   PREVIOUS MONTH
===================================================== */

function previousMonth(){

    if(
        currentMonthIndex>0
    ){

        currentMonthIndex--;

        renderMonth();

        window.scrollTo({
            top:0,
            behavior:"smooth"
        });

    }

}


/* =====================================================
   START
===================================================== */

renderMonth();


</script>
