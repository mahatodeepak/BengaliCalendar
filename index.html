<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>বাংলা ক্যালেন্ডার | Bengali Calendar</title>

<meta name="description"
content="বাংলা ক্যালেন্ডার - বাংলা তারিখ ও ইংরেজি তারিখ দেখুন।">

<style>

/* =========================
   BASIC
========================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:
    "Noto Sans Bengali",
    "Nirmala UI",
    Arial,
    sans-serif;

    background:#f3f6fb;
    color:#222;
}


/* =========================
   HEADER
========================= */

header{
    background:#173f8a;
    color:white;
    text-align:center;
    padding:20px;
}

header h1{
    font-size:28px;
}

header p{
    margin-top:5px;
}


/* =========================
   MAIN CONTAINER
========================= */

.container{
    max-width:1000px;
    margin:auto;
    padding:20px;
}


/* =========================
   CALENDAR BOX
========================= */

.calendar-box{

    background:white;

    border-radius:15px;

    padding:20px;

    box-shadow:
    0 5px 20px
    rgba(0,0,0,0.08);
}


/* =========================
   MONTH NAVIGATION
========================= */

.month-header{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:20px;
}

.month-header button{

    border:none;

    background:#173f8a;

    color:white;

    padding:10px 16px;

    border-radius:8px;

    font-size:18px;

    cursor:pointer;
}

.month-header button:hover{

    background:#0f306b;
}


.month-title{

    text-align:center;
}

.month-title h2{

    color:#173f8a;

    font-size:25px;
}

.month-title p{

    color:#666;

    margin-top:3px;
}


/* =========================
   WEEKDAYS
========================= */

.weekdays{

    display:grid;

    grid-template-columns:
    repeat(7,1fr);

    gap:5px;

    margin-bottom:5px;
}

.weekdays div{

    background:#e8eef9;

    padding:10px 2px;

    text-align:center;

    font-weight:bold;

    color:#173f8a;

    font-size:14px;
}


/* =========================
   DAYS GRID
========================= */

.days{

    display:grid;

    grid-template-columns:
    repeat(7,1fr);

    gap:5px;
}


/* =========================
   DAY CELL
========================= */

.day{

    min-height:75px;

    border:1px solid #e2e2e2;

    border-radius:8px;

    padding:6px;

    background:white;

    overflow:hidden;
}

.day:hover{

    background:#f1f5ff;
}


/* EMPTY CELL */

.day.empty{

    background:#f8f9fb;

    border:1px solid #f0f0f0;
}


/* ENGLISH DATE */

.english-date{

    font-size:18px;

    font-weight:bold;
}


/* BENGALI DATE */

.bengali-date{

    color:#d35400;

    font-size:13px;

    margin-top:5px;
}


/* TODAY */

.today{

    border:2px solid #173f8a;

    background:#eef4ff;
}


/* =========================
   INFORMATION CARDS
========================= */

.info{

    display:grid;

    grid-template-columns:
    repeat(
        auto-fit,
        minmax(200px,1fr)
    );

    gap:15px;

    margin-top:25px;
}

.info-card{

    background:white;

    border-radius:12px;

    padding:20px;

    box-shadow:
    0 4px 15px
    rgba(0,0,0,0.07);
}

.info-card h3{

    color:#173f8a;

    margin-bottom:8px;
}


/* =========================
   FOOTER
========================= */

footer{

    text-align:center;

    padding:25px;

    color:#666;

    font-size:14px;
}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    header h1{

        font-size:23px;
    }

    .container{

        padding:10px;
    }

    .calendar-box{

        padding:10px;
    }

    .day{

        min-height:62px;

        padding:5px;
    }

    .english-date{

        font-size:15px;
    }

    .bengali-date{

        font-size:10px;

        margin-top:3px;
    }

    .weekdays div{

        font-size:11px;

        padding:8px 1px;
    }

    .month-header button{

        padding:8px 11px;

        font-size:16px;
    }

    .month-title h2{

        font-size:20px;
    }
}

</style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header>

<h1>📅 বাংলা ক্যালেন্ডার</h1>

<p>
বাংলা তারিখ ও ইংরেজি তারিখ
</p>

</header>



<!-- =========================
     MAIN
========================= -->

<div class="container">


<div class="calendar-box">


<!-- MONTH HEADER -->

<div class="month-header">

<button
onclick="previousMonth()">
◀
</button>


<div class="month-title">

<h2 id="monthName">
</h2>

<p id="yearName">
</p>

</div>


<button
onclick="nextMonth()">
▶
</button>

</div>



<!-- WEEKDAYS -->

<div class="weekdays">

<div>রবি</div>

<div>সোম</div>

<div>মঙ্গল</div>

<div>বুধ</div>

<div>বৃহস্পতি</div>

<div>শুক্র</div>

<div>শনি</div>

</div>



<!-- CALENDAR -->

<div
id="calendar"
class="days">
</div>


</div>



<!-- =========================
     INFORMATION
========================= -->

<div class="info">


<div class="info-card">

<h3>
📅 আজ
</h3>

<p id="todayEnglish">
</p>

<p id="todayBengali">
</p>

</div>



<div class="info-card">

<h3>
📍 অবস্থান
</h3>

<p>
কলকাতা, পশ্চিমবঙ্গ
</p>

<p>
Latitude: 22.5726° N
</p>

<p>
Longitude: 88.3639° E
</p>

</div>



<div class="info-card">

<h3>
🌙 চাঁদের অবস্থা
</h3>

<p id="moonPhase">
গণনা করা হচ্ছে...
</p>

</div>


</div>

</div>



<!-- =========================
     FOOTER
========================= -->

<footer>

© 2026 Bengali Calendar

</footer>



<!-- =========================
     JAVASCRIPT
========================= -->

<script>


/* =========================
   BENGALI MONTHS
========================= */

const bengaliMonths = [

    "বৈশাখ",

    "জ্যৈষ্ঠ",

    "আষাঢ়",

    "শ্রাবণ",

    "ভাদ্র",

    "আশ্বিন",

    "কার্তিক",

    "অগ্রহায়ণ",

    "পৌষ",

    "মাঘ",

    "ফাল্গুন",

    "চৈত্র"

];



/* =========================
   ENGLISH MONTHS
========================= */

const englishMonths = [

    "January",

    "February",

    "March",

    "April",

    "May",

    "June",

    "July",

    "August",

    "September",

    "October",

    "November",

    "December"

];



/* =========================
   CURRENT DATE
========================= */

const currentDate =
new Date();


let currentMonth =
currentDate.getMonth();


let currentYear =
currentDate.getFullYear();



/* =========================
   BENGALI DATE
========================= */

function getBengaliDate(date){

    const year =
    date.getFullYear();

    const month =
    date.getMonth();

    const day =
    date.getDate();


    let bengaliYear;


    /*
       Bengali New Year
       approximately 14 April
    */

    if(
        month > 3 ||
        (
            month === 3 &&
            day >= 14
        )
    ){

        bengaliYear =
        year - 593;

    }else{

        bengaliYear =
        year - 594;

    }


    /*
       Find Bengali year start
    */

    let startYear =
    year;


    if(
        month < 3 ||
        (
            month === 3 &&
            day < 14
        )
    ){

        startYear =
        year - 1;

    }


    const startDate =
    new Date(
        startYear,
        3,
        14
    );


    const difference =
    Math.floor(
        (
            date -
            startDate
        )
        /
        (
            1000 *
            60 *
            60 *
            24
        )
    );


    /*
       Approximate Bengali
       month and day
    */

    let bengaliMonth =
    Math.floor(
        difference / 30
    );


    let bengaliDay =
    (
        difference % 30
    ) + 1;


    if(
        bengaliMonth < 0
    ){

        bengaliMonth = 0;

    }


    if(
        bengaliMonth > 11
    ){

        bengaliMonth = 11;

    }


    return {

        day:bengaliDay,

        month:bengaliMonth,

        year:bengaliYear

    };

}



/* =========================
   RENDER CALENDAR
========================= */

function renderCalendar(){


    const calendar =
    document.getElementById(
        "calendar"
    );


    /*
       Clear old calendar
    */

    calendar.innerHTML = "";


    /*
       Month title
    */

    document.getElementById(
        "monthName"
    ).textContent =
    englishMonths[
        currentMonth
    ];


    document.getElementById(
        "yearName"
    ).textContent =
    currentYear;



    /*
       IMPORTANT

       getDay():

       0 = Sunday
       1 = Monday
       2 = Tuesday
       3 = Wednesday
       4 = Thursday
       5 = Friday
       6 = Saturday
    */

    const firstDay =
    new Date(
        currentYear,
        currentMonth,
        1
    ).getDay();



    /*
       Number of days
    */

    const totalDays =
    new Date(
        currentYear,
        currentMonth + 1,
        0
    ).getDate();



    /*
       Empty cells
    */

    for(
        let i = 0;
        i < firstDay;
        i++
    ){

        const emptyCell =
        document.createElement(
            "div"
        );


        emptyCell.className =
        "day empty";


        calendar.appendChild(
            emptyCell
        );

    }



    /*
       Dates
    */

    for(
        let day = 1;
        day <= totalDays;
        day++
    ){


        const date =
        new Date(
            currentYear,
            currentMonth,
            day
        );


        const bengali =
        getBengaliDate(
            date
        );


        const cell =
        document.createElement(
            "div"
        );


        cell.className =
        "day";



        /*
           Highlight today
        */

        if(

            day ===
            currentDate.getDate()

            &&

            currentMonth ===
            currentDate.getMonth()

            &&

            currentYear ===
            currentDate.getFullYear()

        ){

            cell.classList.add(
                "today"
            );

        }



        /*
           Cell content
        */

        cell.innerHTML = `

            <div class="english-date">

                ${day}

            </div>

            <div class="bengali-date">

                ${bengali.day}
                ${bengaliMonths[bengali.month]}

            </div>

        `;



        calendar.appendChild(
            cell
        );

    }

}



/* =========================
   PREVIOUS MONTH
========================= */

function previousMonth(){

    currentMonth--;


    if(
        currentMonth < 0
    ){

        currentMonth = 11;

        currentYear--;

    }


    renderCalendar();

}



/* =========================
   NEXT MONTH
========================= */

function nextMonth(){

    currentMonth++;


    if(
        currentMonth > 11
    ){

        currentMonth = 0;

        currentYear++;

    }


    renderCalendar();

}



/* =========================
   TODAY
========================= */

function showToday(){

    const bengali =
    getBengaliDate(
        currentDate
    );


    document.getElementById(
        "todayEnglish"
    ).textContent =

    currentDate.toLocaleDateString(
        "en-IN",
        {

            day:"numeric",

            month:"long",

            year:"numeric"

        }
    );


    document.getElementById(
        "todayBengali"
    ).textContent =

    `${bengali.day}
    ${bengaliMonths[bengali.month]}
    ${bengali.year}`;

}



/* =========================
   MOON PHASE
========================= */

function calculateMoonPhase(){


    const knownNewMoon =
    new Date(
        "2000-01-06T18:14:00Z"
    );


    const today =
    new Date();


    const days =
    (
        today -
        knownNewMoon
    )
    /
    (
        1000 *
        60 *
        60 *
        24
    );


    const cycle =
    days %
    29.530588;


    let phase;


    if(
        cycle < 1.8
    ){

        phase =
        "🌑 অমাবস্যা";

    }

    else if(
        cycle < 7.4
    ){

        phase =
        "🌒 শুক্লপক্ষ";

    }

    else if(
        cycle < 9.2
    ){

        phase =
        "🌓 প্রথম চতুর্থাংশ";

    }

    else if(
        cycle < 14.8
    ){

        phase =
        "🌔 শুক্লপক্ষ";

    }

    else if(
        cycle < 16.6
    ){

        phase =
        "🌕 পূর্ণিমা";

    }

    else if(
        cycle < 22.1
    ){

        phase =
        "🌖 কৃষ্ণপক্ষ";

    }

    else if(
        cycle < 23.9
    ){

        phase =
        "🌗 শেষ চতুর্থাংশ";

    }

    else{

        phase =
        "🌘 কৃষ্ণপক্ষ";

    }


    document.getElementById(
        "moonPhase"
    ).textContent =
    phase;

}



/* =========================
   START
========================= */

renderCalendar();

showToday();

calculateMoonPhase();


</script>

</body>

</html>
