/* =========================================================
   UTILITIES
========================================================= */

function bnNumber(n){

    const map = {
        "0":"০","1":"১","2":"২","3":"৩","4":"৪",
        "5":"৫","6":"৬","7":"৭","8":"৮","9":"৯"
    };

    return String(n).replace(/[0-9]/g,d=>map[d]);
}


function norm(x){

    x %= 360;

    if(x < 0){
        x += 360;
    }

    return x;
}


function istDate(
    year,
    month,
    day,
    hour=0,
    minute=0,
    second=0
){

    return new Date(
        Date.UTC(
            year,
            month,
            day,
            hour,
            minute - 330,
            second
        )
    );
}


function localParts(date){

    const parts =
        new Intl.DateTimeFormat(
            "en-CA",
            {
                timeZone:"Asia/Kolkata",
                year:"numeric",
                month:"2-digit",
                day:"2-digit"
            }
        ).formatToParts(date);

    const r = {};

    parts.forEach(p=>{
        if(p.type !== "literal"){
            r[p.type] = Number(p.value);
        }
    });

    return r;
}


function localMidnight(date){

    const p = localParts(date);

    return istDate(
        p.year,
        p.month-1,
        p.day
    );
}


function nextLocalMidnight(date){

    const p = localParts(date);

    const d =
        new Date(
            Date.UTC(
                p.year,
                p.month-1,
                p.day+1
            )
        );

    return istDate(
        d.getUTCFullYear(),
        d.getUTCMonth(),
        d.getUTCDate()
    );
}


function formatTime(date){

    if(!date){
        return "—";
    }

    return new Intl.DateTimeFormat(
        "bn-IN",
        {
            timeZone:"Asia/Kolkata",
            hour:"numeric",
            minute:"2-digit",
            hour12:true
        }
    ).format(date);
}


function formatFullDate(date){

    return new Intl.DateTimeFormat(
        "en-IN",
        {
            timeZone:"Asia/Kolkata",
            day:"numeric",
            month:"long",
            year:"numeric"
        }
    ).format(date);
}


/* =========================================================
   LAHIRI-STYLE AYANAMSHA
========================================================= */

/*
   Lahiri ayanamsha reference:
   approximately 23°51'25.8" at J2000.

   Mean precession is approximately 50.29 arc-seconds/year.

   This is deliberately isolated here so the astronomical
   layer can later be replaced with a more exact siddhanta
   implementation without changing the UI.
*/

function lahiriAyanamsha(date){

    const J2000 =
        new Date("2000-01-01T12:00:00Z");

    const years =
        (
            date.getTime() -
            J2000.getTime()
        ) /
        (365.2422 * 86400000);

    const base =
        23 +
        51/60 +
        25.8/3600;

    const rate =
        50.29 / 3600;

    return base + rate * years;
}


/* =========================================================
   ECLIPTIC LONGITUDES
========================================================= */

function tropicalSun(date){

    return norm(
        Astronomy.EclipticLongitude(
            Astronomy.Body.Sun,
            date
        )
    );
}


function tropicalMoon(date){

    return norm(
        Astronomy.EclipticGeoMoon(date).elon
    );
}


function siderealSun(date){

    return norm(
        tropicalSun(date) -
        lahiriAyanamsha(date)
    );
}


function siderealMoon(date){

    return norm(
        tropicalMoon(date) -
        lahiriAyanamsha(date)
    );
}


/* =========================================================
   PANCHANG INDICES
========================================================= */

function getTithiIndex(date){

    const elongation =
        norm(
            tropicalMoon(date) -
            tropicalSun(date)
        );

    return Math.floor(
        elongation / 12
    );
}


function getNakshatraIndex(date){

    return Math.floor(
        siderealMoon(date) /
        (360/27)
    );
}


function getNakshatraPada(date){

    const size = 360/27;

    const inside =
        siderealMoon(date) % size;

    return Math.floor(
        inside / (size/4)
    ) + 1;
}


function getYogaIndex(date){

    const value =
        norm(
            siderealSun(date) +
            siderealMoon(date)
        );

    return Math.floor(
        value / (360/27)
    );
}


function getKaranaIndex(date){

    const elongation =
        norm(
            tropicalMoon(date) -
            tropicalSun(date)
        );

    return Math.floor(
        elongation / 6
    );
}


function getKaranaName(index){

    if(index === 0){
        return "কিমস্তুঘ্ন";
    }

    if(index >= 1 && index <= 56){
        return movableKaranas[
            (index-1)%7
        ];
    }

    return fixedKaranas[index] || "";
}


/* =========================================================
   TRANSITION SEARCH
========================================================= */

function findTransition(
    start,
    indexFunction,
    hours=36
){

    const startIndex =
        indexFunction(start);

    let previousTime =
        start.getTime();

    let previousIndex =
        startIndex;

    const step =
        10 * 60 * 1000;

    const end =
        start.getTime() +
        hours * 60 * 60 * 1000;

    for(
        let t = start.getTime()+step;
        t <= end;
        t += step
    ){

        const d = new Date(t);

        const index =
            indexFunction(d);

        if(index !== previousIndex){

            let low =
                previousTime;

            let high =
                t;

            for(let i=0;i<45;i++){

                const mid =
                    Math.floor(
                        (low+high)/2
                    );

                const midDate =
                    new Date(mid);

                const midIndex =
                    indexFunction(midDate);

                if(midIndex === previousIndex){
                    low = mid;
                }
                else{
                    high = mid;
                }
            }

            return new Date(high);
        }

        previousTime = t;
        previousIndex = index;
    }

    return null;
}


/* =========================================================
   RISE / SET
========================================================= */

function getRiseSet(date){

    const midnight =
        localMidnight(date);

    const nextMidnight =
        nextLocalMidnight(date);

    let sunrise = null;
    let sunset = null;
    let moonrise = null;
    let moonset = null;


    try{

        const r =
            Astronomy.SearchRiseSet(
                Astronomy.Body.Sun,
                OBSERVER,
                +1,
                midnight,
                1
            );

        if(r){
            sunrise = r.date;
        }

    }catch(e){
        console.log(e);
    }


    try{

        const r =
            Astronomy.SearchRiseSet(
                Astronomy.Body.Sun,
                OBSERVER,
                -1,
                nextMidnight,
                1
            );

        if(r){
            sunset = r.date;
        }

    }catch(e){
        console.log(e);
    }


    try{

        const r =
            Astronomy.SearchRiseSet(
                Astronomy.Body.Moon,
                OBSERVER,
                +1,
                midnight,
                1
            );

        if(r){

            if(
                r.date >= midnight &&
                r.date < nextMidnight
            ){
                moonrise = r.date;
            }
        }

    }catch(e){
        console.log(e);
    }


    try{

        const r =
            Astronomy.SearchRiseSet(
                Astronomy.Body.Moon,
                OBSERVER,
                -1,
                nextMidnight,
                1
            );

        if(r){

            if(
                r.date >= midnight &&
                r.date <= nextMidnight
            ){
                moonset = r.date;
            }
        }

    }catch(e){
        console.log(e);
    }


    return {
        sunrise,
        sunset,
        moonrise,
        moonset
    };
}


/* =========================================================
   COMPLETE PANCHANG
========================================================= */

function calculatePanchang(date){

    const events =
        getRiseSet(date);

    /*
       Panchang day starts at sunrise.
    */

    const reference =
        events.sunrise ||
        localMidnight(date);


    const ti =
        getTithiIndex(reference);

    const ni =
        getNakshatraIndex(reference);

    const yi =
        getYogaIndex(reference);

    const ki =
        getKaranaIndex(reference);


    const tithiEnd =
        findTransition(
            reference,
            getTithiIndex
        );

    const nakshatraEnd =
        findTransition(
            reference,
            getNakshatraIndex
        );

    const yogaEnd =
        findTransition(
            reference,
            getYogaIndex
        );

    const karanaEnd =
        findTransition(
            reference,
            getKaranaIndex
        );


    let nextKaranaEnd = null;

    if(karanaEnd){

        nextKaranaEnd =
            findTransition(
                karanaEnd,
                getKaranaIndex
            );
    }


    return {

        reference,

        tithiIndex:ti,
        tithiName:tithis[ti],
        paksha:
            ti < 15
            ? "শুক্লপক্ষ"
            : "কৃষ্ণপক্ষ",
        tithiEnd,

        nakshatraIndex:ni,
        nakshatraName:nakshatras[ni],
        nakshatraPada:
            getNakshatraPada(reference),
        nakshatraEnd,

        yogaIndex:yi,
        yogaName:yogas[yi],
        yogaEnd,

        karanaIndex:ki,
        karanaName:getKaranaName(ki),
        karanaEnd,

        nextKaranaName:
            getKaranaName(
                Math.min(ki+1,59)
            ),

        nextKaranaEnd,

        sunrise:events.sunrise,
        sunset:events.sunset,
        moonrise:events.moonrise,
        moonset:events.moonset

    };
}


/* =========================================================
   SPECIAL SYMBOL
========================================================= */

function specialTithi(index){

    if(index === 14){
        return "🌕";
    }

    if(index === 29){
        return "🌑";
    }

    if(index === 10 || index === 26){
        return "🪔";
    }

    return "";
}


/* =========================================================
   BENGALI DATE
========================================================= */

function getBengaliDate(date){

    /*
       Compare calendar dates rather than timestamps.
    */

    const p =
        localParts(date);

    const target =
        new Date(
            Date.UTC(
                p.year,
                p.month-1,
                p.day
            )
        );


    for(let i=0;i<months.length;i++){

        const m =
            months[i];

        const parts =
            m.start.split("-");

        const start =
            new Date(
                Date.UTC(
                    Number(parts[0]),
                    Number(parts[1])-1,
                    Number(parts[2])
                )
            );

        const end =
            new Date(start);

        end.setUTCDate(
            end.getUTCDate()+m.days
        );


        if(
            target >= start &&
            target < end
        ){

            const diff =
                Math.floor(
                    (
                        target-start
                    ) /
                    86400000
                );

            return {

                monthIndex:i,
                monthName:m.bn,
                monthEnglish:m.en,
                date:diff+1,
                year:1433

            };
        }
    }

    return null;
}


/* =========================================================
   GREGORIAN DATE FOR BENGALI DATE
========================================================= */

function getGregorianDate(
    monthIndex,
    day
){

    const m =
        months[monthIndex];

    const p =
        m.start.split("-");

    return istDate(
        Number(p[0]),
        Number(p[1])-1,
        Number(p[2])+day-1,
        12
    );
}


/* =========================================================
   SHUBHKARMA
========================================================= */

function getShubhkarma(
    month,
    day
){

    const result = [];

    Object.keys(shubhkarma)
    .forEach(type=>{

        const dates =
            shubhkarma[type][month] || [];

        if(dates.includes(day)){
            result.push(type);
        }

    });

    return result;
}


/* =========================================================
   SHUBHKARMA MONTH BOX
========================================================= */

function createShubhkarma(month){

    let html = `
        <div class="shubhkarma">

            <div class="shubhkarma-title">
                🌸 শুভকর্ম — ${month.bn}
            </div>

            <div class="shubh-list">
    `;

    let found = false;

    Object.keys(shubhkarma)
    .forEach(type=>{

        const dates =
            shubhkarma[type][month.bn] || [];

        if(dates.length){

            found = true;

            html += `
                <div class="shubh-item">
                    ${type}:
                    ${dates.map(
                        d=>bnNumber(d)
                    ).join(", ")}
                </div>
            `;
        }

    });


    if(!found){

        html += `
            <div class="shubh-item">
                এই মাসে সংরক্ষিত শুভকর্ম নেই
            </div>
        `;
    }


    html += `
            </div>
        </div>
    `;

    return html;
}


/* =========================================================
   MONTH STATE
========================================================= */

let currentMonthIndex = 4;
let selectedDate = null;


/* =========================================================
   RENDER MONTH
========================================================= */

function renderMonth(){

    const container =
        document.getElementById(
            "calendarContainer"
        );

    const month =
        months[currentMonthIndex];


    let html = `

        <div class="month-card">

            <div class="month-header">

                <button
                    onclick="previousMonth()">
                    ‹
                </button>

                <div class="month-title">
                    ${month.bn} ১৪৩৩
                    • ${month.en}
                    (${month.period})
                </div>

                <button
                    onclick="nextMonth()">
                    ›
                </button>

            </div>

            ${createShubhkarma(month)}

            <div class="weekdays">
    `;


    weekdays.forEach(day=>{
        html += `<div>${day}</div>`;
    });


    html += `
            </div>

            <div class="calendar">
    `;


    /*
       Correct weekday of first Gregorian date.
    */

    const first =
        getGregorianDate(
            currentMonthIndex,
            1
        );

    const firstWeekday =
        first.getDay();


    for(
        let i=0;
        i<firstWeekday;
        i++
    ){

        html += `
            <div class="day-box empty"></div>
        `;
    }


    for(
        let day=1;
        day<=month.days;
        day++
    ){

        const date =
            getGregorianDate(
                currentMonthIndex,
                day
            );

        const panchang =
            calculatePanchang(date);

        const special =
            specialTithi(
                panchang.tithiIndex
            );


        const selected =
            selectedDate &&
            localParts(selectedDate).year ===
            localParts(date).year &&
            localParts(selectedDate).month ===
            localParts(date).month &&
            localParts(selectedDate).day ===
            localParts(date).day
            ? " selected"
            : "";


        html += `

            <div
                class="day-box${selected}"
                onclick="
                    showDateDetails(
                        ${currentMonthIndex},
                        ${day}
                    )
                "
            >

                <div class="date-line">

                    <span class="bn-date">
                        ${bnNumber(day)}
                    </span>

                    <span class="en-date">
                        ${localParts(date).day}
                    </span>

                </div>

                <div class="tithi">
                    ${panchang.tithiName}
                </div>

                <div class="tithi-time">
                    শেষ ${formatTime(
                        panchang.tithiEnd
                    )}
                </div>

                <div class="special">
                    ${special}
                </div>

            </div>

        `;
    }


    html += `
            </div>
        </div>
    `;


    /*
       Important:
       Assign complete HTML only after everything
       has been built. This prevents the box from
       disappearing.
    */

    container.innerHTML = html;
}


/* =========================================================
   MONTH NAVIGATION
========================================================= */

function previousMonth(){

    currentMonthIndex--;

    if(currentMonthIndex < 0){
        currentMonthIndex =
            months.length-1;
    }

    selectedDate = null;

    renderMonth();
    clearDetails();
}


function nextMonth(){

    currentMonthIndex++;

    if(
        currentMonthIndex >=
        months.length
    ){
        currentMonthIndex = 0;
    }

    selectedDate = null;

    renderMonth();
    clearDetails();
}


/* =========================================================
   CLEAR DETAILS
========================================================= */

function clearDetails(){

    document.getElementById(
        "detailDate"
    ).innerHTML =
        "একটি তারিখ নির্বাচন করুন";

    document.getElementById(
        "detailContent"
    ).innerHTML = `
        <div class="loading">
            ক্যালেন্ডার থেকে একটি তারিখে ক্লিক করুন।
        </div>
    `;
}

            </div>

                ${panchang.tithiName}

                <br>
                শেষ:

                    panchang.yogaEnd
                )}
            </div>

            <div class="info">

                <br>

                    panchang.karanaEnd
                )}
            </div>

        </div>


        <div class="section-title">
            🌅 সূর্য ও চন্দ্র
        </div>


        <div class="panchang-grid">

            <div class="info">

                )}

                )}

        </div>

        </div>


        ${shubhHTML}

    `;

        document.getElementById(
            "detailsBox"
        ).scrollIntoView({

        });

    },100);
}
