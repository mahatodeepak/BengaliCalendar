function karanaName(index){

    if(index === 0){
        return "কিমস্তুঘ্ন";
    }

    if(index >= 1 && index <= 56){
        return movableKaranas[(index - 1) % 7];
    }

    return fixedKaranas[index] || "";
}


/* =========================================================

/*
   Convert Kolkata local clock time into a real Date object.
   Kolkata = UTC+5:30.
*/

function istDate(
    year,
    month,
    day,
    hour=0,
    minute=0,
    second=0
){

    return new Date(
        Date.UTC(
            year,
            month,
            day,
            hour,
            minute - 330,
            second
        )
    );

}


function dateParts(date){

    const formatter = new Intl.DateTimeFormat(
        "en-CA",
        {
            timeZone:LOCATION.tz,
            year:"numeric",
            month:"2-digit",
            day:"2-digit"
        }
    );

    const parts = formatter.formatToParts(date);

    let result = {};

    parts.forEach(p=>{
        if(p.type !== "literal"){
            result[p.type] = Number(p.value);
        }
    });

    return result;
}


function localMidnight(date){

    const p = dateParts(date);

    return istDate(
        p.year,
        p.month - 1,
        p.day
    );

}


function nextLocalMidnight(date){

    const p = dateParts(date);

    const d = new Date(
        Date.UTC(
            p.year,
            p.month - 1,
            p.day + 1
        )
    );

    return istDate(
        d.getUTCFullYear(),
        d.getUTCMonth(),
        d.getUTCDate()
    );

}

        {
            timeZone:LOCATION.tz,
            hour:"numeric",
            minute:"2-digit",
            hour12:true
        }
    ).format(date);

}


function formatEnglishDate(date){

    return new Intl.DateTimeFormat(
        "en-IN",
        {
            timeZone:LOCATION.tz,
            day:"numeric",
            month:"short"
        }
    ).format(date);

}


function formatFullEnglishDate(date){

    return new Intl.DateTimeFormat(
        "en-IN",
        {
            timeZone:LOCATION.tz,
            day:"numeric",
            month:"long",
            year:"numeric"
        }
    ).format(date);

}


/* =========================================================
   12. NORMALIZE ANGLE
   ========================================================= */

function norm(angle){

    angle %= 360;

    if(angle < 0){
        angle += 360;
    }

    return angle;
}


/* =========================================================
   13. APPROXIMATE LAHIRI AYANAMSHA
   ========================================================= */

function ayanamsha(date){

    const p = dateParts(date);

    const yearFraction =
        p.year +
        ((Date.UTC(p.year,p.month-1,p.day) -
          Date.UTC(p.year,0,1)) /
         (365.2422 * 86400000));

    const years = yearFraction - 2000;

    return 23.85675 + 0.013968 * years;
}


/* =========================================================
   14. ASTRONOMICAL LONGITUDES
   ========================================================= */

function sunLongitude(date){

    return norm(
        Astronomy.EclipticLongitude(
            Astronomy.Body.Sun,
            date
        )
    );

}


function moonLongitude(date){

    /*
       EclipticGeoMoon gives geocentric ecliptic
       longitude of the Moon.
    */

    return norm(
        Astronomy.EclipticGeoMoon(date).elon
    );

}


function siderealMoonLongitude(date){

    return norm(
        moonLongitude(date) -
        ayanamsha(date)
    );

}


function siderealSunLongitude(date){

    return norm(
        sunLongitude(date) -
        ayanamsha(date)
    );

}


/* =========================================================
   15. TITHI INDEX
   ========================================================= */

function tithiIndex(date){

    const elongation = norm(
        moonLongitude(date) -
        sunLongitude(date)
    );

    return Math.floor(
        elongation / 12
    );

}


/* =========================================================
   16. NAKSHATRA INDEX
   ========================================================= */

function nakshatraIndex(date){

    const moon = siderealMoonLongitude(date);

    return Math.floor(
        moon / (360 / 27)
    );

}


function nakshatraPada(date){

    const moon = siderealMoonLongitude(date);

    const nakSize = 360 / 27;

    const inside =
        moon % nakSize;

    return Math.floor(
        inside / (nakSize / 4)
    ) + 1;

}


/* =========================================================
   17. YOGA INDEX
   ========================================================= */

function yogaIndex(date){

    const value = norm(
        siderealSunLongitude(date) +
        siderealMoonLongitude(date)
    );

    return Math.floor(
        value / (360 / 27)
    );

}


/* =========================================================
   18. KARANA INDEX
   ========================================================= */

function karanaIndex(date){

    const elongation = norm(
        moonLongitude(date) -
        sunLongitude(date)
    );

    return Math.floor(
        elongation / 6
    );

}


/* =========================================================
   19. GENERIC TRANSITION SEARCH
   ========================================================= */

function findTransition(
    startDate,
    indexFunction,
    maxHours=36
){

    const startIndex =
        indexFunction(startDate);

    let previousDate = startDate;

    let previousIndex =
        startIndex;

    /*
       10-minute scan.
    */

    const stepMs =
        10 * 60 * 1000;

    const endDate =
        new Date(
            startDate.getTime() +
            maxHours * 60 * 60 * 1000
        );

    for(
        let t = startDate.getTime() + stepMs;
        t <= endDate.getTime();
        t += stepMs
    ){

        const currentDate =
            new Date(t);

        const currentIndex =
            indexFunction(currentDate);

        if(currentIndex !== previousIndex){

            /*
               Binary search for exact transition.
            */

            let low =
                previousDate.getTime();

            let high =
                currentDate.getTime();

            for(let i=0;i<40;i++){

                const mid =
                    Math.floor(
                        (low + high) / 2
                    );

                const midDate =
                    new Date(mid);

                const midIndex =
                    indexFunction(midDate);

                if(midIndex === previousIndex){
                    low = mid;
                }
                else{
                    high = mid;
                }

            }

            return new Date(high);
        }

        previousDate =
            currentDate;

        previousIndex =
            currentIndex;
    }

    return null;
}


/* =========================================================
   20. SUNRISE / SUNSET / MOONRISE / MOONSET
   ========================================================= */

function getRiseSet(date){

    const midnight =
        localMidnight(date);

    const nextMidnight =
        nextLocalMidnight(date);

    let sunrise = null;
    let sunset = null;
    let moonrise = null;
    let moonset = null;

    try{

        const sr =
            Astronomy.SearchRiseSet(
                Astronomy.Body.Sun,
                OBSERVER,
                +1,
                midnight,
                1
            );

        if(sr){
            sunrise = sr.date;
        }

    }catch(e){
        console.warn("Sunrise:",e);
    }


    try{

        const ss =
            Astronomy.SearchRiseSet(
                Astronomy.Body.Sun,
                OBSERVER,
                +1,
                nextMidnight,
                1
            );

        /*
           Search next sunrise and use previous day
           as reference if necessary.
        */

        if(ss){

            const candidate =
                ss.date;

            if(
                candidate >= midnight &&
                candidate < nextMidnight
            ){
                sunrise = candidate;
            }
        }

    }catch(e){
        console.warn("Sunrise fallback:",e);
    }


    try{

        const sunsetSearch =
            Astronomy.SearchRiseSet(
                Astronomy.Body.Sun,
                OBSERVER,
                -1,
                nextMidnight,
                1
            );

        if(sunsetSearch){

            const candidate =
                sunsetSearch.date;

            if(
                candidate >= midnight &&
                candidate <= nextMidnight
            ){
                sunset = candidate;
            }
        }

    }catch(e){
        console.warn("Sunset:",e);
    }


    try{

        const mr =
            Astronomy.SearchRiseSet(
                Astronomy.Body.Moon,
                OBSERVER,
                +1,
                midnight,
                1
            );

        if(mr){

            const candidate =
                mr.date;

            if(
                candidate >= midnight &&
                candidate < nextMidnight
            ){
                moonrise = candidate;
            }
        }

    }catch(e){
        console.warn("Moonrise:",e);
    }


    try{

        const ms =
            Astronomy.SearchRiseSet(
                Astronomy.Body.Moon,
                OBSERVER,
                -1,
                nextMidnight,
                1
            );

        if(ms){

            const candidate =
                ms.date;

            if(
                candidate >= midnight &&
                candidate <= nextMidnight
            ){
                moonset = candidate;
            }
        }

    }catch(e){
        console.warn("Moonset:",e);
    }


    /*
       Extra fallback searches.
    */

    if(!sunrise){

        try{

            const r =
                Astronomy.SearchRiseSet(
                    Astronomy.Body.Sun,
                    OBSERVER,
                    +1,
                    midnight,
                    2
                );

            if(r){
                sunrise = r.date;
            }

        }catch(e){}
    }


    if(!sunset){

        try{

            const r =
                Astronomy.SearchRiseSet(
                    Astronomy.Body.Sun,
                    OBSERVER,
                    -1,
                    nextMidnight,
                    -2
                );

            if(r){
                sunset = r.date;
            }

        }catch(e){}
    }


    return {
        sunrise,
        sunset,
        moonrise,
        moonset
    };

}


/* =========================================================
   21. PANCHANG DATA FOR A DATE
   ========================================================= */

function calculatePanchang(date){

    const riseSet =
        getRiseSet(date);

    /*
       Panchang values are taken at sunrise.
       If sunrise cannot be found, use local midnight.
    */

    const reference =
        riseSet.sunrise ||
        localMidnight(date);


    const tIndex =
        tithiIndex(reference);

    const nIndex =
        nakshatraIndex(reference);

    const yIndex =
        yogaIndex(reference);

    const kIndex =
        karanaIndex(reference);


    const tithiEnd =
        findTransition(
            reference,
            tithiIndex,
            36
        );


    const nakshatraEnd =
        findTransition(
            reference,
            nakshatraIndex,
            36
        );


    const yogaEnd =
        findTransition(
            reference,
            yogaIndex,
            36
        );


    const karanaEnd =
        findTransition(
            reference,
            karanaIndex,
            36
        );


    /*
       Next karana.
    */

    let nextKaranaEnd = null;

    if(karanaEnd){

        nextKaranaEnd =
            findTransition(
                karanaEnd,
                karanaIndex,
                36
            );
    }


    return {

        reference,

        tithiIndex:tIndex,

        tithiName:tithis[tIndex],

        paksha:
            tIndex < 15
            ? "শুক্লপক্ষ"
            : "কৃষ্ণপক্ষ",

        tithiEnd,

        nakshatraIndex:nIndex,

        nakshatraName:
            nakshatras[nIndex],

        nakshatraPada:
            nakshatraPada(reference),

        nakshatraEnd,

        yogaIndex:yIndex,

        yogaName:
            yogas[yIndex],

        yogaEnd,

        karanaIndex:kIndex,

        karanaName:
            karanaName(kIndex),

        karanaEnd,

        nextKaranaName:
            karanaName(
                Math.min(kIndex + 1,59)
            ),

        nextKaranaEnd,

        sunrise:
            riseSet.sunrise,

        sunset:
            riseSet.sunset,

        moonrise:
            riseSet.moonrise,

        moonset:
            riseSet.moonset

    };

}


/* =========================================================
   22. SPECIAL TITHI SYMBOL
   ========================================================= */

function specialTithi(index){

    if(index === 14){
        return "🌕";
    }

    if(index === 29){
        return "🌑";
    }

    if(index === 10 || index === 26){
        return "🪔";
    }

    return "";

}


/* =========================================================
   23. BENGALI DATE
   ========================================================= */

function bengaliDateForGregorian(
    gregorianDate
){

    /*
       Uses the fixed Bengali month table
       already defined for this project.
    */

    for(let i=0;i<months.length;i++){

        const m =
            months[i];

        const start =
            new Date(
                m.start + "T00:00:00"
            );

        const end =
            new Date(start);

        end.setDate(
            end.getDate() + m.days
        );

        if(
            gregorianDate >= start &&
            gregorianDate < end
        ){

            const difference =
                Math.floor(
                    (
                        gregorianDate -
                        start
                    ) /
                    86400000
                );

            return {

                monthIndex:i,

                monthName:m.bn,

                monthEnglish:m.en,

                date:
                    difference + 1,

                year:1433

            };

        }

    }


    return null;

}


/* =========================================================
   24. GET DATE FROM MONTH + DAY
   ========================================================= */

function getGregorianDate(
    monthIndex,
    dayNumber
){

    const m =
        months[monthIndex];

    const start =
        new Date(
            m.start + "T00:00:00"
        );

    const d =
        new Date(start);

    d.setDate(
        d.getDate() +
        dayNumber -
        1
    );

    return d;

}


/* =========================================================
   25. SHUBHKARMA FOR DATE
   ========================================================= */

function getShubhkarmaForDate(
    monthName,
    day
){

    const result = [];

    Object.keys(shubhkarma)
    .forEach(type=>{

        const days =
            shubhkarma[type][monthName] || [];

        if(days.includes(day)){
            result.push(type);
        }

    });

    return result;

}

/* =========================================================
   27. CREATE SHUBHKARMA AREA
   ========================================================= */

function createShubhkarma(
    month
){

    let html = `
        <div class="shubhkarma">
            <div class="shubhkarma-title">
                🌸 শুভকর্ম — ${month.bn}
            </div>

            <div class="shubh-list">
    `;

    let found = false;

    Object.keys(shubhkarma)
    .forEach(type=>{

        const days =
            shubhkarma[type][month.bn] || [];

        if(days.length > 0){

            found = true;

            html += `
                <div class="shubh-item">
                    ${type}: 
                    ${days.map(d=>bnNumber(d)).join(", ")}
                </div>
            `;

        }

    });


    if(!found){

        html += `
            <div class="shubh-item">
                এই মাসে সংরক্ষিত শুভকর্মের তারিখ নেই
            </div>
        `;

    }


    html += `
            </div>
        </div>
    `;

    return html;

}


/* =========================================================
   28. RENDER MONTH
   ========================================================= */

async function renderMonth(){

    const container =
        document.getElementById(
            "calendarContainer"
        );


    /*
       IMPORTANT:
       Build the complete month HTML first.
       This prevents the calendar box from disappearing.
    */

    const month =
        months[currentMonthIndex];


    let html = `

        <div class="month-card">

            <div class="month-header">

                <button
                    onclick="previousMonth()"
                    aria-label="Previous month">
                    ‹
                </button>

                <div class="month-title">
                    ${month.bn} ১৪৩৩
                    • ${month.en}
                    (${month.period})
                </div>

                <button
                    onclick="nextMonth()"
                    aria-label="Next month">
                    ›
                </button>

            </div>

            ${createShubhkarma(month)}

            <div class="weekdays">
    `;


    weekdays.forEach(day=>{

        html += `
            <div>${day}</div>
        `;

    });


    html += `
            </div>

            <div class="calendar">
    `;


    /*
       Find first weekday.
    */

    const firstDate =
        new Date(
            month.start + "T00:00:00"
        );

    const firstWeekday =
        firstDate.getDay();


    for(
        let i=0;
        i<firstWeekday;
        i++
    ){

        html += `
            <div class="day-box empty"></div>
        `;

    }


    /*
       Render every Bengali date.
    */

    for(
        let day=1;
        day<=month.days;
        day++
    ){

        const gregorian =
            getGregorianDate(
                currentMonthIndex,
                day
            );


        const panchang =
            calculatePanchang(
                gregorian
            );


        const bengali =
            bnNumber(day);


        const english =
            gregorian.getDate();


        const special =
            specialTithi(
                panchang.tithiIndex
            );


        const shubh =
            getShubhkarmaForDate(
                month.bn,
                day
            );


        const selected =
            selectedDate &&
            selectedDate.getTime() ===
            gregorian.getTime()
            ? " selected"
            : "";


        html += `

            <div
                class="day-box${selected}"
                onclick="showDateDetails(
                    ${currentMonthIndex},
                    ${day}
                )"
            >

                <div class="date-line">

                    <span class="bn-date">
                        ${bengali}
                    </span>

                    <span class="en-date">
                        ${english}
                    </span>

                </div>

                <div class="tithi">
                    ${panchang.tithiName}
                </div>

                <div class="tithi-time">
                    শেষ ${formatTime(
                        panchang.tithiEnd
                    )}
                </div>

                <div class="special">
                    ${special}
                </div>

                <div class="day-summary">
                    ⭐ ${panchang.nakshatraName}
                </div>

                ${
                    shubh.length
                    ? `
                    <div
                        class="day-summary"
                        title="${shubh.join(" • ")}"
                    >
                        🌸 ${shubh[0]}
                    </div>
                    `
                    : ""
                }

            </div>

        `;

    }


    html += `
            </div>
        </div>
    `;


    /*
       Put complete HTML into container only once.
    */

    container.innerHTML = html;

}


/* =========================================================

    currentMonthIndex--;

        currentMonthIndex =
            months.length - 1;

    selectedDate = null;

    renderMonth();

    clearDetails();

/* =========================================================
   30. NEXT MONTH
   ========================================================= */

function nextMonth(){

    currentMonthIndex++;

    if(
        currentMonthIndex >=
        months.length
    ){
        currentMonthIndex = 0;
    }

    selectedDate = null;

    renderMonth();

    clearDetails();

}
